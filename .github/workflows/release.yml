# Baut bei jedem Versions-Tag (z. B. 1.0.1) das Addon-ZIP, legt es als GitHub-Release ab
# und lädt es auf CurseForge hoch (Secrets CF_API_KEY und CF_PROJECT_ID im Environment "Curse Forge").
name: Release

on:
  push:
    tags:
      - "[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: Curse Forge  # dort liegen die Secrets CF_API_KEY und CF_PROJECT_ID
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Paket bauen und veröffentlichen
        uses: BigWigsMods/packager@v2
        with:
          # -n: Dateiname und Label nur mit der Versionsnummer (ohne den automatischen Zusatz "-forever")
          args: -n "{package-name}-{project-version}:{project-version}" ${{ secrets.CF_PROJECT_ID && format('-p {0}', secrets.CF_PROJECT_ID) || '' }}
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
