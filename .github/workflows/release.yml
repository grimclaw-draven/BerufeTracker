# Baut bei jedem Versions-Tag (z. B. v1.2.1) das Addon-ZIP, legt es als GitHub-Release ab
# und lädt es auf CurseForge hoch, sobald CF_API_KEY und CF_PROJECT_ID eingerichtet sind.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Paket bauen und veröffentlichen
        uses: BigWigsMods/packager@v2
        with:
          args: ${{ vars.CF_PROJECT_ID && format('-p {0}', vars.CF_PROJECT_ID) || '' }}
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
